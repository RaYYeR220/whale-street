# Keeps the free demo server awake: a free Render web service sleeps after 15 minutes without
# traffic. The engine address comes from the ENGINE_URL repository variable
# (Settings > Secrets and variables > Actions > Variables).
name: Keep the demo server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the engine status endpoint
        env:
          ENGINE_URL: ${{ vars.ENGINE_URL }}
        run: |
          if [ -z "$ENGINE_URL" ]; then
            echo "::notice::The ENGINE_URL repository variable is not set; nothing to ping."
            exit 0
          fi
          curl -fsS --max-time 60 --retry 2 --retry-delay 15 --retry-all-errors \
            -o /dev/null -w "status %{http_code} in %{time_total}s\n" \
            "${ENGINE_URL%/}/api/status"
