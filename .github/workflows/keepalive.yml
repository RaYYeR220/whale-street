# Keeps the free demo server awake: a free Render web service sleeps after 15 minutes without
# traffic. The engine address comes from the ENGINE_URL repository variable
# (Settings > Secrets and variables > Actions > Variables).
name: Keep the demo server awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the engine status endpoint
        env:
          ENGINE_URL: ${{ vars.ENGINE_URL }}
        run: |
          if [ -z "$ENGINE_URL" ]; then
            echo "::notice::The ENGINE_URL repository variable is not set; nothing to ping."
            exit 0
          fi

          url="${ENGINE_URL%/}/api/status"
          ping() {
            curl -fsS --max-time 60 --retry 2 --retry-delay 15 --retry-all-errors \
              -o /dev/null -w "status %{http_code} in %{time_total}s\n" "$url"
          }

          start=$(date +%s)
          if ! ping; then
            echo "::error::Could not reach the engine at $url"
            exit 1
          fi
          elapsed=$(( $(date +%s) - start ))
          echo "first ping took ${elapsed}s"

          # A quick reply means the engine was already awake. A slow one means this ping is what
          # woke it, so nudge it again a minute later to make sure it is fully up, not just
          # answering its first request while everything else still spins up.
          if [ "$elapsed" -gt 20 ]; then
            echo "::notice::Cold start detected (${elapsed}s); pinging again in 60s."
            sleep 60
            ping || echo "::warning::Second ping failed; the first ping already reached the engine."
          fi
